<!doctype html><meta charset=utf-8><body style="margin:0;background:#141b26">
<canvas id=c width=820 height=470></canvas>
<script type="module">
const out=document.getElementById('c').getContext('2d');
const sheet=new Image(); sheet.src='/assets/sheet/sheet.png'; await sheet.decode();
const F={garage:[2,2,189,191],tractor:[2,248,170,191]};
const CELL=55, GS=CELL*1.02/220, VS=CELL*1.06/220;
const BACK=20*GS, MOUTH=92*GS, HALF=48*GS;      // px, from the cell centre
const Z=3.3, GX=430, GY=190;
const sx=v=>GX+v*Z, sy=v=>GY+v*Z;

function put(f,atX,s,alpha){const[a,b,w,h]=F[f];
  out.save();out.globalAlpha=alpha;out.translate(sx(atX),GY);out.rotate(f==='garage'?-Math.PI/2:0);
  out.scale(s*Z,s*Z);out.drawImage(sheet,a,b,w,h,-w/2,-h/2,w,h);out.restore();}
function box(near,far,half,stroke,fill){
  out.save();out.lineWidth=2;out.beginPath();
  out.moveTo(sx(near),sy(-half));out.lineTo(sx(near),sy(half));
  out.lineTo(sx(far), sy(half)); out.lineTo(sx(far), sy(-half));
  out.closePath();out.fillStyle=fill;out.fill();out.strokeStyle=stroke;out.stroke();out.restore();}

// tarmac
out.fillStyle='#5a697b';
for(let i=-1;i<3;i++){out.beginPath();out.roundRect(sx(i*CELL-CELL/2)+5,sy(-CELL/2)+5,CELL*Z-10,CELL*Z-10,9*Z);out.fill();}
put('garage',0,GS,1);
put('tractor',30,VS,0.4);                       // a car part way in, faint

box(MOUTH,BACK,HALF,'#38d9a9','rgba(56,217,169,0.32)');          // mouthShape
box(BACK,-3.2*CELL,0.75*CELL,'#ff6b6b','rgba(255,107,107,0.20)'); // doorShape

// cell edge
out.save();out.setLineDash([7,6]);out.strokeStyle='#9aa7b8';out.lineWidth=1.5;
out.beginPath();out.moveTo(sx(CELL/2),sy(-CELL/2-6));out.lineTo(sx(CELL/2),sy(CELL/2+6));out.stroke();out.restore();

out.font='13px system-ui';out.textBaseline='middle';
function tick(v,label,col,lift){
  out.save();out.strokeStyle=col;out.lineWidth=1.5;out.setLineDash([3,4]);
  out.beginPath();out.moveTo(sx(v),sy(-CELL/2)-6);out.lineTo(sx(v),sy(-CELL/2)-18-lift);out.stroke();out.restore();
  out.fillStyle=col;out.textAlign='center';out.fillText(label,sx(v),sy(-CELL/2)-27-lift);}
tick(MOUTH,'mouth · 0.427 cell','#38d9a9',0);
tick(BACK,'back wall · 0.093 cell','#ffd43b',24);
tick(CELL/2,'cell edge · 0.5','#9aa7b8',48);

out.textAlign='left';out.fillStyle='#cfd8e3';out.font='14px system-ui';
out.fillText('car drives in  ⟵', sx(CELL*1.5), GY);

// legend
const LY=340;
function key(y,col,fill,title,sub){
  out.save();out.fillStyle=fill;out.strokeStyle=col;out.lineWidth=2;
  out.beginPath();out.rect(40,y-11,34,22);out.fill();out.stroke();out.restore();
  out.fillStyle=col;out.font='bold 14px system-ui';out.textAlign='left';out.fillText(title,88,y-6);
  out.fillStyle='#9aa7b8';out.font='13px system-ui';out.fillText(sub,88,y+11);}
key(LY,'#38d9a9','rgba(56,217,169,0.32)','mouthShape  →  masks the GARAGE layer drawn over the convoys',
    'a hole the size of the painted opening, so a car inside it is seen through the doorway');
key(LY+58,'#ff6b6b','rgba(255,107,107,0.20)','doorShape  →  masks the CONVOY layer',
    'from the back wall, 12 cells deep, 1.5 cells wide — only while a convoy is driving in');
document.title='ready';
</script>
